[env]
platform = platformio/renesas-ra@^1.9.0
framework = arduino
lib_deps =
    adafruit/Adafruit BusIO@^1.17.4
    greiman/SdFat@^2.3.1

[env:uno_r4_minima]
board = uno_r4_minima

[env:uno_r4_wifi]
board = uno_r4_wifi
